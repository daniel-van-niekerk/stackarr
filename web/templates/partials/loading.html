{{define "loading-overlay"}}
<div class="loading-overlay" id="loadingOverlay">
    <div class="progress-container">
        <div class="spinner-text-wrapper">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Processing...</div>
        </div>
        <div id="progressStatus" style="margin-top: 1rem; font-size: 0.95rem; display: none;"></div>

        <!-- Overall progress bar -->
        <div class="overall-progress" id="progressBarContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-bar-fill" id="overallProgress" style="width: 0%"></div>
            </div>
            <div class="progress-percentage" id="overallPercentage">0%</div>
        </div>

        <!-- Layer-by-layer progress -->
        <div class="layer-progress-list" id="layerProgressContainer">
            <!-- Dynamically populated with layer progress -->
        </div>
    </div>
</div>
{{end}}
