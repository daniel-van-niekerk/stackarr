{{define "login.html"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - StackArr</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/static/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/static/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/static/apple-touch-icon.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/theme.css">
        <link rel="stylesheet" href="/static/css/base.css">
        <link rel="stylesheet" href="/static/css/pages/login.css">
    </head>
    <body>
        <div class="container">
            <div style="text-align: center; margin-bottom: 1.5rem">
                <img
                    src="/static/logo.png"
                    alt="StackArr"
                    style="height: 60px; margin-bottom: 0.5rem"
                />
                <h1 style="margin-bottom: 0">StackArr</h1>
            </div>

            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    />
                </div>

                <button type="submit">Login</button>
            </form>
        </div>
        <script>
            // Apply dark mode from system preference on load
            if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                document.body.classList.add("dark-mode");
            }
        </script>
    </body>
</html>
{{end}}
