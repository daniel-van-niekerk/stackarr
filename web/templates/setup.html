{{define "setup.html"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Setup - StackArr</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/static/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/static/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/static/apple-touch-icon.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-form: #ffffff;
                --text-primary: #333333;
                --text-secondary: #555555;
                --text-tertiary: #666666;
                --input-border: #e0e0e0;
                --input-bg: #ffffff;
            }

            body.dark-mode {
                --bg-form: #2d2d2d;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-tertiary: #999999;
                --input-border: #404040;
                --input-bg: #1a1a1a;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                background: var(--bg-form);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                max-width: 400px;
                width: 100%;
            }
            h1 {
                color: var(--text-primary);
                font-family: "Poppins", sans-serif;
                font-weight: 800;
                font-size: 2.5rem;
                letter-spacing: -1px;
            }
            h2 {
                color: var(--text-primary);
                margin-bottom: 1.5rem;
            }
            p {
                color: var(--text-tertiary);
                margin-bottom: 1.5rem;
            }
            .form-group {
                margin-bottom: 1rem;
            }
            label {
                display: block;
                margin-bottom: 0.5rem;
                color: var(--text-secondary);
                font-weight: 500;
            }
            input[type="text"],
            input[type="password"] {
                width: 100%;
                padding: 0.75rem;
                border: 2px solid var(--input-border);
                background: var(--input-bg);
                color: var(--text-primary);
                border-radius: 6px;
                font-size: 1rem;
            }
            input:focus {
                outline: none;
                border-color: #667eea;
            }
            button {
                width: 100%;
                padding: 0.75rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover {
                transform: translateY(-2px);
            }
            .error {
                background: #fee;
                border: 1px solid #fcc;
                color: #c33;
                padding: 0.75rem;
                border-radius: 6px;
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div style="text-align: center; margin-bottom: 1.5rem">
                <img
                    src="/static/logo.png"
                    alt="StackArr"
                    style="height: 60px; margin-bottom: 0.5rem"
                />
                <h1 style="margin-bottom: 0">StackArr</h1>
            </div>
            <h2>First-Time Setup</h2>
            <p>Create your admin account to get started.</p>

            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}

            <form method="POST" action="/setup">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                        minlength="3"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                    />
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirm Password</label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        required
                        minlength="8"
                    />
                </div>

                <button type="submit">Create Admin Account</button>
            </form>
        </div>
        <script>
            // Apply dark mode from system preference on load
            if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                document.body.classList.add("dark-mode");
            }
        </script>
    </body>
</html>
{{end}}
