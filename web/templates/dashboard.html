{{define "dashboard.html"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard - StackArr</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                max-width: 400px;
                width: 100%;
            }
            h1 {
                color: #333;
                margin-bottom: 1.5rem;
            }
            p {
                color: #666;
                margin-bottom: 1.5rem;
            }
            .info-box {
                background: #f5f5f5;
                padding: 1rem;
                border-radius: 6px;
                margin-bottom: 1rem;
            }
            button {
                width: 100%;
                padding: 0.75rem;
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover {
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 StackArr Dashboard</h1>
            <p>Welcome! You are successfully logged in.</p>

            <div class="info-box"><strong>User ID:</strong> {{.UserID}}</div>

            <form method="POST" action="/logout">
                <button type="submit">Logout</button>
            </form>
        </div>
    </body>
</html>
{{end}}
