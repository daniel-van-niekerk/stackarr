version: "3.8"

services:
  stackarr:
    build: .
    container_name: stackarr
    restart: unless-stopped
    ports:
      - "8877:8877"
    volumes:
      # Mount Docker socket to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist database and compose files
      - stackarr-data:/var/lib/stackarr
      # Optional: Mount host paths for containers
      - /mnt:/mnt
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8877
      - DATABASE_PATH=/var/lib/stackarr/stackarr.db
    networks:
      - stackarr

networks:
  stackarr:
    name: stackarr

volumes:
  stackarr-data:
    name: stackarr-data
